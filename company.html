<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>업체 페이지 | CleanMate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body{
      margin:0;
      padding:20px;
      font-family:-apple-system, BlinkMacSystemFont, "Noto Sans KR", system-ui;
      background:#f5f7fb;
    }

    header{
      max-width:1200px;
      margin:0 auto 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      margin:0;
      font-size:20px;
      color:#2e7d32;
    }

    .container{
      max-width:1200px;
      margin:0 auto;
    }

    .card{
      background:#fff;
      border-radius:14px;
      padding:16px;
      margin-bottom:12px;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
      font-size:14px;
    }

    .status{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
    }

    .status.assigned{ background:#e3f2fd; color:#1565c0; }
    .status.done{ background:#e8f5e9; color:#2e7d32; }

    button{
      padding:6px 12px;
      border-radius:8px;
      border:1px solid #ccc;
      background:#fff;
      cursor:pointer;
      font-weight:600;
    }
  </style>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<script>
const companyId = sessionStorage.getItem("company_id");
const companyName = sessionStorage.getItem("company_name");

if(!companyId || !companyName){
  alert("로그인이 필요합니다");
  location.href = "company-login.html";
}
</script>
<header>
  <h1>🏢 업체 전용 페이지</h1>
  <button onclick="logout()">로그아웃</button>
</header>
  <!-- ===============================
     👤 팀장 등록 / 목록
     =============================== -->
<div class="container">

  <div class="card">
    <h3>👤 팀장 등록하기</h3>

    <input id="leaderName" placeholder="팀장 이름"
      style="width:100%;padding:8px;margin-bottom:6px;" />

    <input id="leaderPassword" type="password" placeholder="비밀번호"
      style="width:100%;padding:8px;margin-bottom:10px;" />

    <button onclick="addLeader()">팀장 등록</button>
  </div>

  <div class="card">
    <h3>📋 현재 등록된 팀장</h3>
    <div id="leaderList">불러오는 중...</div>
  </div>

</div>

<div class="container" id="orderList">
  불러오는 중...
</div>

<script>
/* ===============================
   1️⃣ Supabase 연결
   =============================== */
const SUPABASE_URL = "https://nuchpyxjyqcpldpnffhu.supabase.co";
const SUPABASE_KEY = "sb_publishable_edX6Oi2eo5A5MjYYo323Fg_6ESnzQmL";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ⚠️ 지금은 업체 고정 */
const COMPANY_NAME = companyName;

/* ===============================
   2️⃣ 업체에 배정된 주문만 조회
   =============================== */
async function loadOrders(){
  const list = document.getElementById("orderList");
  list.innerHTML = "불러오는 중...";

  const { data, error } = await supabaseClient
  .from("orders")
.select("*")
.in("status", ["배정완료", "완료"])
.eq("assigned_company", COMPANY_NAME)
.order("created_at", { ascending:false });

  if(error){
    list.innerHTML = "주문 불러오기 실패";
    console.error(error);
    return;
  }

  if(!data || data.length === 0){
    list.innerHTML = "배정된 주문이 없습니다.";
    return;
  }

  list.innerHTML = data.map(order => `
  <div class="card">
    <b>${order.name}</b> (${order.phone})<br>
    주소: ${order.address || "-"}<br>
    청소일: ${order.clean_date || "-"}<br>
    상태:
    <span class="status ${
      order.status === "완료" ? "done" : "assigned"
    }">
      ${order.status}
    </span>

   ${ order.status === "배정완료"
  ? `<div style="margin-top:10px;">
       <button onclick="assignLeader('${order.id}')">👤 팀장 배정</button>
       <button onclick="markDone('${order.id}')">✅ 작업완료</button>
       ${
         order.assigned_leader
           ? `<div style="margin-top:6px;color:#2e7d32;font-weight:700;">
                팀장 배정 완료 (${order.assigned_leader})
              </div>`
           : ""
       }
     </div>`
  : ""
}
  </div>
`).join("");
}
async function markDone(id){
  const { error } = await supabaseClient
    .from("orders")
    .update({
      status: "완료",
      review_open: true
    })
    .eq("id", id);

  if (error) {
    alert("작업완료 처리 실패");
    console.error(error);
    return;
  }

  alert("작업 완료 처리되었습니다.");
  loadOrders();
}
  
/* ===============================
   기타
   =============================== */
function logout(){
  sessionStorage.clear();
  location.href = "company-login.html";
}
/* ===============================
   👤 팀장 관리 (이 업체 전용)
   =============================== */

async function addLeader(){
  const name = document.getElementById("leaderName").value.trim();
  const pw = document.getElementById("leaderPassword").value.trim();

  if(!name || !pw){
    alert("이름과 비밀번호를 입력하세요");
    return;
  }

  const { error } = await supabaseClient
    .from("teams")
    .insert([{
      company_name: COMPANY_NAME,
      leader_name: name,
      password: pw
    }]);

  if(error){
    alert("팀장 등록 실패");
    console.error(error);
    return;
  }

  alert("팀장 등록 완료");
  document.getElementById("leaderName").value = "";
  document.getElementById("leaderPassword").value = "";

  loadLeaders();
}
  

async function loadLeaders(){
  const box = document.getElementById("leaderList");

  const { data, error } = await supabaseClient
    .from("teams")
    .select("leader_name")
    .eq("company_name", COMPANY_NAME)
    .order("created_at", { ascending:false });

  if(error){
    box.innerHTML = "불러오기 실패";
    return;
  }

  if(!data || data.length === 0){
    box.innerHTML = "등록된 팀장 없음";
    return;
  }

  box.innerHTML = data
    .map(t => `• ${t.leader_name}`)
    .join("<br>");
}
/* ===============================
   👤 팀장 배정
   =============================== */
async function assignLeader(orderId){
  const leaderName = prompt("배정할 팀장 이름을 정확히 입력하세요");

  if(!leaderName) return;

  const { error } = await supabaseClient
    .from("orders")
    .update({
      assigned_leader: leaderName
    })
    .eq("id", orderId);

  if(error){
    alert("팀장 배정 실패");
    console.error(error);
    return;
  }

  alert("팀장 배정 완료");
  loadOrders();
}
/* 최초 실행 */
loadLeaders();
loadOrders();
</script>

</body>
</html>
