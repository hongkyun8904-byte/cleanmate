<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CleanMate - 예약 확인</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    body{
      margin:0;
      background:#f5f7fb;
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",system-ui,sans-serif;
      color:#222;
    }
    .wrap{
      max-width:520px;
      margin:0 auto;
      padding:18px;
    }
    .logo{
      text-align:center;
      margin-bottom:14px;
    }
    .logo img{ height:42px; }

    .card{
      background:#fff;
      border-radius:16px;
      padding:16px;
      box-shadow:0 10px 26px rgba(15,35,52,.08);
      margin-bottom:12px;
    }
    h1{ font-size:18px;margin:0 0 8px; }
    h2{ font-size:15px;margin:0 0 6px; }

    input{
      width:100%;
      padding:10px;
      border-radius:10px;
      border:1px solid #d1d9e6;
      font-size:14px;
    }
    button{
      width:100%;
      margin-top:10px;
      padding:12px;
      border:none;
      border-radius:999px;
      background:#0288d1;
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }

    .status{
      padding:10px;
      border-radius:12px;
      font-size:13px;
      margin-top:8px;
    }
    .wait{ background:#fff8e1; border:1px solid #ffe082; }
    .done{ background:#e3f2fd; border:1px solid #90caf9; }

    .label{ color:#6b7280;font-size:12px; }
    .review-btn{
  flex:1;
  padding:10px;
  border-radius:999px;
  border:1.5px solid #0288d1;
  background:#fff;
  color:#0288d1;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.review-btn:hover{
  background:#e3f2fd;
}
  </style>
</head>
<body>

<div class="wrap">

<!-- ✅ 상단 로고 (크게 + 메인 이동) -->
<div style="text-align:center;margin:16px 0 10px;">
  <a href="index.html">
    <img 
      src="logo-cleanmate.png"
      alt="CleanMate 로고"
      style="height:72px;opacity:0.95;"
    >
  </a>
</div>
<div style="
  display:flex;
  justify-content:space-between;
  margin-bottom:16px;
">
<button onclick="history.back()" style="
  padding:8px 12px;
  border-radius:10px;
  border:1.5px solid #0288d1;
  background:#fff;
  color:#0288d1;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
">
  ← 이전으로
</button>

  <button onclick="goHome()" style="
    padding:8px 14px;
    border-radius:10px;
    border:none;
    background:#0288d1;
    color:#fff;
    cursor:pointer;
  ">
    홈으로
  </button>
</div>
  <div class="card">
    <h1>예약 상태 확인</h1>
    <div class="label">예약 시 입력하신 휴대폰 번호를 입력해주세요.</div>

    <input id="phoneInput" placeholder="010-0000-0000" />
    <button onclick="loadMyOrder()">예약 조회하기</button>
  </div>

  <div id="result"></div>

</div>

<script>
const SUPABASE_URL = "https://nuchpyxjyqcpldpnffhu.supabase.co";
const SUPABASE_KEY = "sb_publishable_edX6Oi2eo5A5MjYYo323Fg_6ESnzQmL";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  function goHome(){
  window.location.href = "index.html";
}
  
async function loadMyOrder(){
  const phone = document.getElementById("phoneInput").value.trim();
  const box = document.getElementById("result");

  if(!phone){
    alert("휴대폰 번호를 입력해주세요.");
    return;
  }

  box.innerHTML = "조회 중입니다...";

  const { data, error } = await supabaseClient
    .from("orders")
    .select("*")
    .eq("phone", phone)
    .order("created_at", { ascending:false })
    .limit(1);

  if(error || !data || data.length === 0){
    box.innerHTML = `
      <div class="card">
        예약 정보를 찾을 수 없습니다.
      </div>
    `;
    return;
  }

  const o = data[0];
  window.currentOrderId = o.id;
  window.currentCustomerName = o.name;
  
  // ✅ 예약금 / 잔금 계산
const depositAmount = 60000; // 예약금 6만원
const totalAmount = o.estimated_price_number || 0;
const remainingAmount = totalAmount
  ? totalAmount - depositAmount
  : null;

  let statusBox = "";
  if(o.status === "배정완료"){
    statusBox = `<div class="status done">✅ 우수 업체가 배정되었습니다.</div>`;
  }else{
    statusBox = `<div class="status wait">⏳ 현재 예약 접수 상태입니다.</div>`;
  }
  const canWriteReview = o.status === "배정완료";

  box.innerHTML = `
    <div class="card">
      <h2>고객님의 예약 정보</h2>

      ${statusBox}

      <p><b>청소 일정</b><br>
      ${o.clean_date || "-"} / ${o.clean_time || "-"}</p>
      <p><b>결제 정보</b><br>
예약금: <b>60,000원</b><br>
잔금: <b>
  ${remainingAmount !== null
    ? remainingAmount.toLocaleString("ko-KR") + "원"
    : "-"}
</b>
</p>

      ${o.side_clean_time ? `<p><b>사이청소</b><br>${o.side_clean_time}</p>` : ""}

      <p><b>주소</b><br>${o.address || "-"}</p>

      <p><b>배정 업체</b><br>
      ${o.assigned_company || "배정 대기 중"}</p>

      <p class="label">
        * 입금 확인 후 우수 업체가 자동 배정됩니다.
      </p>
    ${canWriteReview ? `
<hr style="margin:16px 0;">

<div style="margin-top:12px;">
  <h3 style="font-size:15px;margin-bottom:6px;">
    📝 청소는 만족하셨나요?
  </h3>

  <div style="font-size:12px;color:#6b7280;margin-bottom:10px;">
    고객님의 후기는 클린메이트에게 큰 힘이 됩니다.
  </div>

  <div style="display:flex;gap:6px;margin-bottom:10px;">
    <button onclick="selectReviewScore(5)" class="review-btn">😊 너무 만족해요</button>
    <button onclick="selectReviewScore(4)" class="review-btn">🙂 만족해요</button>
    <button onclick="selectReviewScore(2)" class="review-btn">😐 아쉬워요</button>
  </div>

  <textarea
    id="reviewText"
    placeholder="청소 후기를 남겨주세요 (선택)"
    style="
      width:100%;
      height:80px;
      border-radius:10px;
      border:1px solid #d1d9e6;
      padding:10px;
      font-size:13px;
      margin-bottom:10px;
    "
  ></textarea>

  <div style="margin-bottom:10px;">
    <div style="font-size:13px;font-weight:600;margin-bottom:4px;">
      사진 첨부 (최대 10장)
    </div>
    <input
      type="file"
      id="reviewPhotos"
      accept="image/*"
      multiple
      onchange="checkReviewPhotos()"
    />
  </div>

  <button
    onclick="submitReview()"
    style="
      width:100%;
      padding:12px;
      border:none;
      border-radius:999px;
      background:#0288d1;
      color:#fff;
      font-weight:800;
      cursor:pointer;
    "
  >
    후기 등록하기
  </button>
</div>
` : ""}
      <button onclick="openKakao()" style="
  width:100%;
  margin-top:14px;
  padding:14px;
  border:none;
  border-radius:999px;
  background:#111;
  color:#fff;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
">
  💬 클린메이트 상담원과 상담하기
</button>
    </div>
  `;
}
  function openKakao() {
  window.open("https://open.kakao.com/o/sItc0P4h", "_blank");
}
let selectedReviewScore = null;

function selectReviewScore(score){
  selectedReviewScore = score;
  alert(
    score === 5 ? "너무 만족해요 선택됨" :
    score === 4 ? "만족해요 선택됨" :
    "아쉬워요 선택됨"
  );
}

function checkReviewPhotos(){
  const input = document.getElementById("reviewPhotos");
  if (input.files.length > 10) {
    alert("사진은 최대 10장까지만 업로드할 수 있습니다.");
    input.value = "";
  }
}

async function uploadReviewPhotos(files){
  const urls = [];

  for (let file of files) {
    const ext = file.name.split(".").pop();
    const fileName = `reviews/${crypto.randomUUID()}.${ext}`;

    const { error } = await supabaseClient
      .storage
      .from("review-photos")
      .upload(fileName, file);

    if (error) {
      alert("사진 업로드 실패");
      console.error(error);
      return [];
    }

    const { data } = supabaseClient
      .storage
      .from("review-photos")
      .getPublicUrl(fileName);

    urls.push(data.publicUrl);
  }

  return urls;
}
 async function submitReview(){

  if (!window.currentOrderId) {
    alert("주문 정보를 찾을 수 없습니다.");
    return;
  }

  if (!selectedReviewScore) {
    alert("만족도를 선택해주세요.");
    return;
  }

  const text = document.getElementById("reviewText").value.trim();
  const photoInput = document.getElementById("reviewPhotos");

  let photoUrls = [];

  if (photoInput && photoInput.files.length > 0) {
    if (photoInput.files.length > 10) {
      alert("사진은 최대 10장까지 가능합니다.");
      return;
    }

    photoUrls = await uploadReviewPhotos(photoInput.files);
    if (!photoUrls.length) return;
  }

 const originalName = window.currentCustomerName || "고객";

let maskedName = originalName;
if (originalName.length === 2) {
  maskedName = originalName[0] + "*";
} else if (originalName.length >= 3) {
  maskedName = originalName[0] + "*" + originalName.slice(2);
}
  const { error } = await supabaseClient
    .from("reviews")
    .insert([{
      order_id: window.currentOrderId,
      author: maskedName,
      text: text || "",
      star: selectedReviewScore,
      photos: photoUrls,
      visible: true
    }]);

  if (error) {
    console.error(error);
    alert("후기 저장 실패");
    return;
  }

  alert("후기가 정상적으로 등록되었습니다 🙏");

  // 후기 섹션으로 이동
  window.location.href = "index.html#review-section";
}
  
</script>
// ✅ URL에 phone 있으면 자동 조회
const params = new URLSearchParams(window.location.search);
const phoneFromUrl = params.get("phone");

if (phoneFromUrl) {
  document.getElementById("phoneInput").value = phoneFromUrl;
  loadMyOrder(); // 🔥 자동 조회
}
</body>

</html>
