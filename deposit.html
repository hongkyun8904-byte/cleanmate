<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>예약금 안내 | 환승클린</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", system-ui, sans-serif;
      background:#f5f7fb;
      margin:0;
      padding:20px;
      color:#222;
    }

    .wrap {
      max-width:480px;
      margin:0 auto;
      background:#fff;
      border-radius:16px;
      padding:24px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align:center;
      margin-bottom:20px;
    }

    .logo img {
      height:48px;
      opacity:0.9;
    }

    h1 {
      font-size:18px;
      text-align:center;
      margin-bottom:14px;
    }

    .box {
      background:#fff8e1;
      border:1px solid #ffe082;
      border-radius:12px;
      padding:16px;
      font-size:14px;
      line-height:1.6;
      margin-bottom:20px;
    }

    .account {
      background:#f9fafc;
      border:1px dashed #cfd8dc;
      border-radius:12px;
      padding:14px;
      font-size:14px;
      margin-bottom:20px;
    }

    .account b {
      display:block;
      margin-bottom:6px;
    }

    button {
      width:100%;
      padding:14px;
      border:none;
      border-radius:999px;
      background:#0288d1;
      color:#fff;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
    }

    button:hover {
      background:#0073b0;
    }

    .note {
      margin-top:12px;
      font-size:12px;
      color:#777;
      text-align:center;
    }
  </style>
</head>
<body>

<div class="wrap">

<div class="logo">
  <a href="index.html">
    <img src="logo-환승클린.png" alt="환승클린 로고">
  </a>
</div>

  <h1>예약금 안내 페이지입니다</h1>

  <div class="box">
    예약 요청이 정상적으로 접수되었습니다.<br><br>
    <b>입금 확인 후</b><br>
    고객님께 가장 적합한 <b>우수 팀장님이 자동 배정</b>됩니다.
  </div>

  <div class="account">
    <b>예약금 60,000원</b>
    은행: 카카오뱅크<br>
    계좌번호: 3333-0545-72187<br>
    예금주: 김홍균
  </div>
<div class="box" style="background:#e3f2fd;border-color:#90caf9;">
  <b>결제 수단 선택</b><br><br>

  <button onclick="selectPayment('transfer')" style="margin-bottom:8px;">
    💸 계좌이체
  </button>

  <button onclick="selectPayment('card')" style="background:#ccc;color:#333;">
    💳 카드결제 (준비중)
  </button>

  <p id="paymentNotice" style="margin-top:10px;color:#d32f2f;font-size:13px;"></p>
</div>
  
<button onclick="goHome()">입금 완료 확인</button>
  <button onclick="openKakao()" style="
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:999px;
  background:#111;
  color:#fff;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
">
  💬 환승클린 상담원 연결
</button>
 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* 1️⃣ Supabase 기본 설정 */
const SUPABASE_URL = "https://nuchpyxjyqcpldpnffhu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_edX6Oi2eo5A5MjYYo323Fg_6ESnzQmL";

/* 2️⃣ Supabase 연결 */
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

/* 3️⃣ 입금 완료 버튼 */
function goHome() {
  alert("입금 확인 요청이 접수되었습니다.\n관리자 확인 중입니다.");
  window.location.href = "mypage.html";
}

/* 4️⃣ 카카오 상담 버튼 */
function openKakao() {
  window.open("https://open.kakao.com/o/sItc0P4h", "_blank");
}

/* 5️⃣ 결제 수단 선택 */
async function selectPayment(method) {
  if (method === "card") {
    document.getElementById("paymentNotice").innerText =
      "카드 결제는 현재 준비 중입니다. 계좌이체로 진행해주세요.";
    return;
  }

  document.getElementById("paymentNotice").innerText =
    "계좌이체를 선택하셨습니다. 입금 후 아래 버튼을 눌러주세요.";

  // ✅ 어떤 주문인지 가져오기
  const orderId = sessionStorage.getItem("order_id");

  if (!orderId) {
    alert("주문 정보를 찾을 수 없습니다.");
    return;
  }

  // ✅ Supabase에 결제 상태 저장
  const { error } = await supabaseClient
    .from("orders")
    .update({
      payment_method: "transfer",
      payment_status: "pending"
    })
    .eq("id", orderId);

  if (error) {
    alert("결제 정보 저장 실패");
    console.error(error);
    return;
  }
}
</script>
  
</body>
</html>
