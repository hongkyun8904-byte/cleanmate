<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>팀장 페이지 | CleanMate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body{
      margin:0;
      padding:20px;
      font-family:-apple-system, BlinkMacSystemFont, "Noto Sans KR", system-ui;
      background:#f5f7fb;
    }

    header{
      max-width:1200px;
      margin:0 auto 20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      margin:0;
      font-size:20px;
      color:#0288d1;
    }

    .container{
      max-width:1200px;
      margin:0 auto;
    }

    .card{
      background:#fff;
      border-radius:14px;
      padding:16px;
      margin-bottom:12px;
      box-shadow:0 6px 18px rgba(0,0,0,0.06);
      font-size:14px;
    }

    .status{
      display:inline-block;
      padding:4px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
    }

    .status.wait{ background:#fff3cd; color:#856404; }
    .status.done{ background:#e3f2fd; color:#1565c0; }

    button{
      margin-top:8px;
      padding:6px 12px;
      border-radius:8px;
      border:1px solid #0288d1;
      background:#fff;
      color:#0288d1;
      cursor:pointer;
      font-weight:600;
    }
  </style>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<script>
const leaderName = sessionStorage.getItem("leader_name");
const companyName = sessionStorage.getItem("company_name");

if(!leaderName || !companyName){
  alert("로그인이 필요합니다");
  location.href = "leader-login.html";
}

</script>
<header>
  <h1 id="leaderTitle">👷 팀장 전용 페이지</h1>
  <button onclick="logout()">로그아웃</button>
</header>

<div class="container" id="orderList">
  불러오는 중...
</div>

<script>
/* ===============================
   1️⃣ Supabase 연결
   =============================== */
const SUPABASE_URL = "https://nuchpyxjyqcpldpnffhu.supabase.co";
const SUPABASE_KEY = "sb_publishable_edX6Oi2eo5A5MjYYo323Fg_6ESnzQmL";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* ===============================
   2️⃣ 주문 불러오기
   =============================== */
async function loadOrders(){
  const list = document.getElementById("orderList");
  list.innerHTML = "불러오는 중...";

  const { data, error } = await supabaseClient
    .from("orders")
    .select("*")
    .eq("assigned_company", companyName)
    .eq("assigned_leader", leaderName)
    .in("status", ["배정완료", "완료"])
    .order("created_at", { ascending:false });

  if(error){
    list.innerHTML = "주문 불러오기 실패";
    console.error(error);
    return;
  }

  if(!data || data.length === 0){
    list.innerHTML = "배정된 주문이 없습니다.";
    return;
  }

  /* ===============================
     🔹 진행중 / 완료 작업 분리
  =============================== */
  const workingOrders = data.filter(o => o.status === "배정완료");
  const completedOrders = data.filter(o => o.status === "완료");

  let html = "";

  /* ===============================
     🔹 진행중 작업
  =============================== */
  if (workingOrders.length > 0) {
    html += `<h3 style="margin:16px 0;">🧹 진행중 작업</h3>`;

    html += workingOrders.map(order => `
      <div class="card">
        <b>${order.name}</b> (${order.phone})<br>
        주소: ${order.address || "-"}<br>
        구조/평수: ${order.structure || "-"} / ${order.supply_area ? order.supply_area + "평" : "-"}<br>
        청소일: ${order.clean_date || "-"}<br>
        시간: ${order.clean_time || "-"}<br>

        상태:
        <span class="status wait">배정완료</span>

        <button onclick="markDone('${order.id}')">
          ✅ 작업완료
        </button>
      </div>
    `).join("");
  } else {
    html += `<p>진행중인 작업이 없습니다.</p>`;
  }

  /* ===============================
     🔹 완료 작업 (날짜별)
  =============================== */
  if (completedOrders.length > 0) {
    html += `<h3 style="margin:24px 0 12px;">📦 내가 완료한 작업</h3>`;

    const grouped = {};

    completedOrders.forEach(o => {
      const date = o.completed_at
        ? o.completed_at.slice(0, 10)
        : "날짜 없음";

      if (!grouped[date]) grouped[date] = [];
      grouped[date].push(o);
    });

    Object.keys(grouped)
      .sort((a,b) => b.localeCompare(a))
      .forEach(date => {
        html += `<div style="margin:10px 0;font-weight:700;">📅 ${date}</div>`;

        html += grouped[date].map(order => `
          <div class="card" style="opacity:0.8;">
            <b>${order.name}</b> (${order.phone})<br>
            주소: ${order.address || "-"}<br>
            구조/평수: ${order.structure || "-"} / ${order.supply_area ? order.supply_area + "평" : "-"}<br>
            완료시간: ${
              order.completed_at
                ? new Date(order.completed_at).toLocaleTimeString()
                : "-"
            }
          </div>
        `).join("");
      });
  }

  list.innerHTML = html;
}
/* ===============================
   3️⃣ 상태 변경
   =============================== */
async function markPaid(id){
  await supabaseClient
    .from("orders")
    .update({ status:"배정완료", assigned_company:"환승클린" })
    .eq("id", id);

  loadOrders();
}

async function markDone(id){
  const { error } = await supabaseClient
    .from("orders")
    .update({
      status: "완료",
      completed_at: new Date().toISOString()
    })
    .eq("id", id);

  if (error) {
    alert("작업완료 처리 실패");
    console.error(error);
    return;
  }

  loadOrders(); // 즉시 반영
}

/* ===============================
   기타
   =============================== */
function logout(){
  sessionStorage.clear();
  location.href = "leader-login.html";
}

/* 최초 실행 */
loadOrders();
</script>
<script>
/* ===============================
   👷 팀장 페이지 상단 타이틀 세팅 (확정본)
   =============================== */
document.addEventListener("DOMContentLoaded", function () {
  const leaderName = sessionStorage.getItem("leader_name");
  const companyName = sessionStorage.getItem("company_name");

  if (!leaderName || !companyName) {
    alert("로그인이 필요합니다");
    location.href = "leader-login.html";
    return;
  }

  const titleEl = document.getElementById("leaderTitle");
  if (titleEl) {
    titleEl.innerText = `👷 ${companyName} / ${leaderName} 팀장`;
  }
});
</script>
</body>
</html>
