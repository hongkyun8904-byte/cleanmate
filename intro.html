<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>환승클린</title>
  <style>
    body{
      margin:0;
      background:#f5f7fb;
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",system-ui,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      overflow:hidden;
    }

    .wrap{
      text-align:center;
      position:relative;
    }

    .logo{
      opacity:0;
      transform:scale(0.6);
      animation: logoIn 1.4s ease-out forwards;
    }

    @keyframes logoIn{
      0%{ opacity:0; transform:scale(0.6); }
      100%{ opacity:0.12; transform:scale(1.4); }
    }

    .text{
      position:relative;
      z-index:2;
      margin-top:-120px;
      font-size:20px;
      font-weight:800;
      line-height:1.5;
      color:#222;
    }

    .text span{
      display:block;
    }

    .text strong{
      color:#0288d1;
    }
  </style>
</head>
<body>

<div class="wrap">
  <!-- 🔹 로고 (처음엔 없다가 크게 등장) -->
  <img src="logo-환승클린.png" class="logo" alt="환승클린 로고" width="420"/>

  <!-- 🔹 안내 문구 (로고에 가리지 않음) -->
  <div class="text">
    <span>지금까지 속이고 속이는 입주청소는 그만!</span>
    <span>낮은 가격에 혹해</span>
    <span>현장에서 더 비싼 추가금을 겪어보셨나요?</span>
    <br/>
    <span><strong>클린메이트</strong>는</span>
    <span>납득 가능한 기준과</span>
    <span>투명한 요금만 부과합니다.</span>
  </div>
</div>

<script>
  sessionStorage.setItem("introDone", "1");

  setTimeout(() => {
    location.href = "landing.html";
  }, 2500);
</script>

</body>

</html>
