<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>업체 로그인 | 환승클린</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      margin:0;
      padding:20px;
      background:#f5f7fb;
      font-family:-apple-system, BlinkMacSystemFont, "Noto Sans KR", system-ui;
    }
    .box{
      max-width:420px;
      margin:100px auto;
      background:#fff;
      padding:24px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }
    h1{
      font-size:18px;
      margin-bottom:16px;
      text-align:center;
    }
    input{
      width:100%;
      padding:12px;
      margin-bottom:10px;
      border-radius:10px;
      border:1px solid #d1d9e6;
      font-size:14px;
    }
    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:999px;
      background:#2e7d32;
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>🏢 업체 로그인</h1>

  <input id="companyName" placeholder="업체명" />
  <input id="password" type="password" placeholder="비밀번호" />

  <button onclick="login()">로그인</button>
</div>

<script>
const SUPABASE_URL = "https://nuchpyxjyqcpldpnffhu.supabase.co";
const SUPABASE_KEY = "sb_publishable_edX6Oi2eo5A5MjYYo323Fg_6ESnzQmL";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function login(){
  const name = document.getElementById("companyName").value.trim();
  const pw   = document.getElementById("password").value;

  if(!name || !pw){
    alert("모두 입력하세요");
    return;
  }

  const { data, error } = await supabaseClient
    .from("companies")
    .select("*")
    .eq("company_name", name)
    .eq("is_active", true)
    .single();

  if(error || !data){
    alert("업체 정보 없음");
    return;
  }

  // 비밀번호 아직 없는 업체 → 최초 설정
  if(!data.password_hash){
    sessionStorage.setItem("company_id", data.id);
    location.href = "company-set-password.html";
    return;
  }

  // 비밀번호 체크 (지금은 단순 비교)
  if(data.password_hash !== pw){
    alert("비밀번호 틀림");
    return;
  }

  // 로그인 성공
  sessionStorage.setItem("company_id", data.id);
  sessionStorage.setItem("company_name", data.company_name);

  location.href = "company.html";
}
</script>

</body>
</html>
